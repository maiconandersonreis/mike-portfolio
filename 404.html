<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · Page not found — Maicon Reis</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0D0D12">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Caminhos absolutos: o Cloudflare Pages serve esta página em qualquer URL inexistente. -->
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/sections.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <main class="section">
    <div class="container">
      <a class="brand" href="/" aria-label="Maicon Reis — início">maicon_reis<span class="brand__ext">.rb</span></a>

      <div class="notfound__block">
        <p class="eyebrow">404</p>
        <h1 class="section__title">Página não encontrada</h1>
        <p class="prose">O endereço acessado não existe ou foi movido.</p>
      </div>

      <div class="notfound__block" lang="en">
        <p class="eyebrow">404</p>
        <h2 class="section__title">Page not found</h2>
        <p class="prose">The address you requested does not exist or has been moved.</p>
      </div>

      <div class="hero__actions">
        <a class="btn btn--primary" href="/">Voltar ao início</a>
        <a class="btn btn--ghost" href="/" lang="en">Back to home</a>
      </div>
    </div>
  </main>
</body>
</html>
